
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
body {
  background:#06131b;
  color:#00e5ff;
  font-family:Arial;
  text-align:center;
  padding:35px 15px;
}
h1 {font-size:42px;}
.circle {
  width:150px;height:150px;
  border:3px solid #00e5ff;
  border-radius:50%;
  margin:35px auto;
  display:grid;place-items:center;
  box-shadow:0 0 30px #00e5ff;
}
button {
  background:#00e5ff;
  border:0;border-radius:30px;
  padding:15px 25px;
  margin:10px;font-size:17px;
}
#heard {color:white;min-height:30px;}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>YOUR PERSONAL AI ASSISTANT</p>

<div class="circle">JARVIS</div>

<h3 id="status">System Online</h3>
<p id="heard">Waiting for your command...</p>

<button onclick="startListening()">🎤 TALK TO JARVIS</button>
<button onclick="speak('Namaste! Main Jarvis hoon. Kaise madad kar sakta hoon?')">
START JARVIS
</button>

<script>
function speak(message) {
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "hi-IN";
  voice.rate = 0.9;
  speechSynthesis.speak(voice);
}

function startListening() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    document.getElementById("status").innerText =
      "Speech recognition not supported";
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  document.getElementById("status").innerText =
    "Listening...";

  recognition.onresult = function(event) {
    const command =
      event.results[0][0].transcript;

    document.getElementById("heard").innerText =
      "You said: " + command;

    document.getElementById("status").innerText =
      "Command received";

    const reply = "Aapne kaha " + command +
      ". Main aapki baat sun raha hoon.";

    speak(reply);
  };

  recognition.onerror = function() {
    document.getElementById("status").innerText =
      "Microphone error. Please try again.";
  };

  recognition.onend = function() {
    if (document.getElementById("status").innerText
      === "Listening...") {
      document.getElementById("status").innerText =
        "System Online";
    }
  };

  recognition.start();
}
</script>

</body>
</html>
